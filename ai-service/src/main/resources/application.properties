spring.application.name=ai-service
server.port=8087
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.read-only=true
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
jwt.secret=${JWT_SECRET}
ollama.base-url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:4b}
ollama.fast-model=${OLLAMA_FAST_MODEL:qwen2.5:1.5b}
ollama.reasoning-model=${OLLAMA_REASONING_MODEL:${OLLAMA_MODEL:qwen3:4b}}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
