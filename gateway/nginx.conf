events { worker_connections 2048; }

http {
  limit_req_zone $binary_remote_addr zone=ai_chat_by_ip:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=ai_streams_by_ip:10m;
  limit_req_status 429;

  upstream auth_service { server auth-service:8081; }
  upstream inventory_service { server inventory-service:8082; }
  upstream customer_service { server customer-service:8083; }
  upstream supplier_service { server supplier-service:8084; }
  upstream billing_service { server billing-service:8085; }
  upstream reports_service { server reports-service:8086; }
  upstream ai_service { server ai-service:8087; }

  server {
    listen 8080;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Forward the browser session JWT consistently to every protected service.
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;

    location ^~ /api/auth/ { proxy_pass http://auth_service; }
    location ^~ /api/inventory/ { proxy_pass http://inventory_service; }
    location = /api/customers {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://customer_service;
    }
    location ^~ /api/customers/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://customer_service;
    }
    # Match the collection root exactly so Nginx does not redirect POSTs to
    # the slash-suffixed route and strip the Bearer header along the way.
    location = /api/suppliers { proxy_pass http://supplier_service; }
    location ^~ /api/suppliers/ { proxy_pass http://supplier_service; }
    location ^~ /api/billing/ { proxy_pass http://billing_service; }
    location ^~ /api/reports/ { proxy_pass http://reports_service; }

    location ^~ /api/ai/chat/stream {
      limit_req zone=ai_chat_by_ip burst=5 nodelay;
      limit_conn ai_streams_by_ip 3;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 240s;
      send_timeout 240s;
      # Location-level proxy_set_header directives replace the inherited set,
      # so repeat the request identity headers for this streaming route.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Connection "";
      proxy_set_header X-Accel-Buffering no;
      proxy_pass http://ai_service;
    }

    location ^~ /api/ai/chat {
      limit_req zone=ai_chat_by_ip burst=5 nodelay;
      proxy_read_timeout 240s;
      proxy_pass http://ai_service;
    }

    location ^~ /api/ai/ { proxy_pass http://ai_service; }

    location / {
      default_type application/json;
      return 404 '{"message":"No API route matches this path."}';
    }
  }
}
